# Редактор сайта libooks.ae
# Вход: libooks.ae/admin/ → «Войти с токеном доступа»
# Сохранение сразу публикует: коммит в main → сборка → сайт через 2–3 минуты

backend:
  name: github
  repo: Live-Informatics-Publishing-FZE/LI-site
  branch: main

media_folder: public/assets
public_folder: /assets

# Английская и арабская версии лежат в папках en/ и ar/ с одинаковыми именами.
# Редактор показывает их рядом, в одной карточке.
i18n:
  structure: multiple_folders
  locales: [en, ar]
  default_locale: en

collections:

  # ───────────── НОВОСТИ ─────────────
  - name: news
    label: "Новости"
    label_singular: "новость"
    folder: src/content/news
    i18n: true
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    media_folder: /public/assets/news
    public_folder: /assets/news
    fields:
      - { name: title, label: "Заголовок", widget: string, i18n: true }
      - { name: date, label: "Дата", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", i18n: duplicate }
      - { name: summary, label: "Выжимка", widget: text, i18n: true,
          hint: "Одно-два предложения. Показывается на карточке на главной и в списке новостей" }
      - { name: link, label: "Ссылка для кнопки внизу", widget: string, required: false, i18n: duplicate,
          hint: "Без языка, например series/isharat/ — язык подставится сам. Пусто — кнопки не будет" }
      - { name: image, label: "Изображение", widget: image, required: false, i18n: duplicate,
          hint: "16:9, 1600 × 900, до 300 КБ. Пусто — фирменная заставка" }
      - { name: image_alt, label: "Описание изображения", widget: string, required: false, i18n: true }
      - { name: body, label: "Полный текст", widget: markdown, i18n: true }

  # ───────────── СТАТЬИ ─────────────
  - name: articles
    label: "Статьи и материалы"
    label_singular: "статья"
    folder: src/content/articles
    i18n: true
    create: true
    summary: "{{title}}"
    media_folder: /public/assets/articles
    public_folder: /assets/articles
    fields:
      - { name: title, label: "Заголовок", widget: string, i18n: true }
      - name: section
        label: "Раздел"
        widget: select
        i18n: duplicate
        options:
          - { label: "Родителям · подсказки", value: "tips-for-parents" }
          - { label: "Родителям · материалы для детей", value: "extra-materials" }
          - { label: "Школам · методические материалы", value: "teaching-materials" }
          - { label: "Школам · статьи по методике", value: "methodology" }
      - name: audience
        label: "Аудитория"
        widget: select
        i18n: duplicate
        options:
          - { label: "Родители", value: "parents" }
          - { label: "Школы", value: "schools" }
      - { name: date, label: "Дата", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", i18n: duplicate }
      - { name: seo_description, label: "Подзаголовок", widget: text, i18n: true,
          hint: "Одно предложение. Идёт и под заголовок статьи, и в поисковую выдачу" }
      - { name: seo_title, label: "Заголовок для поиска", widget: string, required: false, i18n: true,
          hint: "Если пусто — берётся обычный заголовок" }
      - { name: image, label: "Изображение", widget: image, required: false, i18n: duplicate,
          hint: "16:9, 1600 × 900. Пусто — ищется файл с именем статьи, затем заставка" }
      - { name: image_alt, label: "Описание изображения", widget: string, required: false, i18n: true }
      - { name: trainer_url, label: "Адрес тренажёра", widget: string, required: false, i18n: duplicate }
      - { name: body, label: "Текст статьи", widget: markdown, i18n: true }

  # ───────────── ИЗДАНИЯ ─────────────
  - name: books
    label: "Издания"
    label_singular: "издание"
    folder: src/content/books
    i18n: true
    create: true
    identifier_field: strand
    summary: "{{strand}} · № {{number}}"
    media_folder: /public/assets/covers
    public_folder: /assets/covers
    fields:
      - name: strand
        label: "Линейка"
        widget: select
        i18n: duplicate
        options:
          - { label: "Manara · Web Lab", value: "manara-web-lab" }
          - { label: "Isharat · Little Tamers", value: "isharat-little-tamers" }
      - { name: number, label: "Номер в линейке", widget: number, value_type: int, i18n: duplicate }
      - { name: of, label: "Всего в линейке", widget: number, value_type: int, i18n: duplicate }
      - { name: title, label: "Название", widget: string, required: false, i18n: true,
          hint: "Пусто — на странице пометка «название не выбрано»" }
      - { name: slogan, label: "Слоган", widget: string, required: false, i18n: true }
      - name: status
        label: "Статус"
        widget: select
        required: false
        i18n: duplicate
        hint: "Пусто — на странице пометка «статус не задан»"
        options:
          - { label: "В продаже", value: "available" }
          - { label: "Готовится к выходу", value: "forthcoming" }
          - { label: "В разработке", value: "in-preparation" }
          - { label: "Не переиздаётся", value: "out-of-print" }
      - { name: age, label: "Возраст", widget: string, required: false, i18n: duplicate }
      - { name: grade, label: "Класс", widget: string, required: false, i18n: duplicate }
      - { name: pages, label: "Страниц", widget: string, required: false, i18n: duplicate }
      - { name: format, label: "Формат", widget: string, required: false, i18n: duplicate }
      - { name: binding, label: "Переплёт", widget: string, required: false, i18n: duplicate }
      - { name: isbn, label: "ISBN", widget: string, required: false, i18n: duplicate }
      - { name: cover, label: "Обложка", widget: image, required: false, i18n: duplicate,
          hint: "3:4, 1200 × 1600. Пусто — обложка собирается автоматически" }
      - { name: description, label: "Описание", widget: text, required: false, i18n: true,
          hint: "Абзацы разделяются пустой строкой" }
      - name: contents
        label: "Что внутри"
        widget: list
        required: false
        i18n: true
        fields:
          - { name: name, label: "Пункт", widget: string }
          - { name: note, label: "Пояснение", widget: string, required: false }

  # ───────────── ЛИНЕЙКИ ─────────────
  - name: strands
    label: "Линейки"
    label_singular: "линейка"
    folder: src/content/strands
    i18n: true
    create: true
    summary: "{{name}}"
    fields:
      - name: series
        label: "Серия"
        widget: select
        i18n: duplicate
        options:
          - { label: "Manara", value: "manara" }
          - { label: "Isharat", value: "isharat" }
          - { label: "Qalam", value: "qalam" }
      - { name: name, label: "Название латиницей", widget: string, i18n: duplicate }
      - { name: name_ar, label: "Название по-арабски", widget: string, required: false, i18n: duplicate }
      - { name: order, label: "Порядок вывода", widget: number, value_type: int, i18n: duplicate }
      - { name: stage, label: "Этап обучения", widget: string, required: false, i18n: true }
      - name: digital
        label: "Цифровая часть"
        widget: object
        required: false
        i18n: duplicate
        hint: "Не отмечайте то, чего в продукте нет"
        fields:
          - name: e_textbook
            label: "Электронный учебник"
            widget: select
            required: false
            options: [{ label: "Есть", value: "available" }, { label: "Готовится", value: "forthcoming" }]
          - name: trainers
            label: "Тренажёры"
            widget: select
            required: false
            options: [{ label: "Есть", value: "available" }, { label: "Готовится", value: "forthcoming" }]
          - name: ai_tutor
            label: "ИИ-помощник"
            widget: select
            required: false
            options: [{ label: "Есть", value: "available" }, { label: "Готовится", value: "forthcoming" }]
      - { name: systemic_problem, label: "Системная проблема", widget: text, required: false, i18n: true,
          hint: "До 400 знаков. Блок с золотой чертой на странице серии" }
      - { name: description, label: "Описание", widget: text, i18n: true }

  # ───────────── СЕРИИ ─────────────
  - name: series
    label: "Серии"
    label_singular: "серия"
    folder: src/content/series
    i18n: true
    create: false
    summary: "{{name}}"
    media_folder: /public/assets/series
    public_folder: /assets/series
    fields:
      - { name: name, label: "Название латиницей", widget: string, i18n: duplicate }
      - { name: name_ar, label: "Название по-арабски", widget: string, i18n: duplicate }
      - { name: code, label: "Код", widget: string, i18n: duplicate, hint: "Три буквы, идут в шифр издания" }
      - { name: metaphor, label: "Метафора", widget: string, i18n: duplicate }
      - { name: order, label: "Порядок вывода", widget: number, value_type: int, i18n: duplicate }
      - { name: logo, label: "Логотип", widget: image, i18n: duplicate }
      - { name: short, label: "Краткое описание", widget: text, i18n: true, hint: "До 200 знаков, на карточке" }
      - { name: description, label: "Описание", widget: text, i18n: true, hint: "2–3 предложения" }

  # ───────────── РЕКВИЗИТЫ ─────────────
  - name: singletons
    label: "Реквизиты и контакты"
    files:
      - name: organization
        label: "Данные организации"
        file: src/content/singletons/organization.yml
        fields:
          - { name: legal_name, label: "Юридическое название", widget: string }
          - { name: legal_name_ar, label: "Название по-арабски", widget: string }
          - { name: legal_form, label: "Организационная форма", widget: string }
          - { name: founded, label: "Год основания", widget: string }
          - { name: jurisdiction, label: "Юрисдикция", widget: string }
          - { name: licence_number, label: "Номер лицензии", widget: string }
          - { name: registration_number, label: "Регистрационный номер", widget: string }
          - { name: activities, label: "Виды деятельности", widget: list }
          - { name: address, label: "Адрес", widget: string }
          - { name: email, label: "Почта", widget: string }
          - { name: phone, label: "Телефон", widget: string }
          - { name: hours, label: "Часы работы", widget: string, required: false }
          - { name: website, label: "Сайт", widget: string }
          - name: documents
            label: "Уставные документы"
            widget: list
            fields:
              - { name: label_en, label: "Название (англ.)", widget: string }
              - { name: label_ar, label: "Название (араб.)", widget: string }
              - { name: file, label: "Файл PDF", widget: file }
