name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Доставка на хостинг в ОАЭ. Раскомментировать нужный способ
      # и добавить секреты в Settings → Secrets and variables → Actions.

      # --- вариант FTP ---
